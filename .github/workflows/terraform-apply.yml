name: Terraform Apply

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: aws-dev
    env:
      AWS_OIDC_ROLE_ARN: ${{ vars.AWS_OIDC_ROLE_ARN }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_LOCK_TABLE: ${{ vars.TF_LOCK_TABLE }}
      TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@v6

      - name: Verify deployment configuration
        shell: bash
        run: |
          required_vars=(AWS_OIDC_ROLE_ARN TF_STATE_BUCKET TF_LOCK_TABLE TF_VAR_alert_email)
          for variable_name in "${required_vars[@]}"; do
            if [[ -z "${!variable_name}" ]]; then
              echo "::error::Repository variable ${variable_name/TF_VAR_alert_email/ALERT_EMAIL} is required for deployment."
              exit 1
            fi
          done

      - name: Deployment notice
        run: echo "Deploying to the optional AWS environment. Local use and CI do not require AWS credentials."

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_OIDC_ROLE_ARN }}
          aws-region: us-east-1

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="dynamodb_table=${TF_LOCK_TABLE}"
        working-directory: terraform/environments/dev

      - name: Terraform Apply
        run: terraform apply -auto-approve
        working-directory: terraform/environments/dev
