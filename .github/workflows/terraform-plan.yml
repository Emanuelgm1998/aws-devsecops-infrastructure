name: Terraform CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: terraform-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Checkov Terraform scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform/environments/dev
          framework: terraform
          # Blocking baseline for the controls implemented by this product.
          # Cost-bearing controls such as WAF, private subnets, and customer-managed
          # KMS keys remain visible in the documented hardening roadmap.
          check: CKV_AWS_19,CKV_AWS_20,CKV_AWS_21,CKV_AWS_24,CKV_AWS_25,CKV_AWS_41,CKV_AWS_53,CKV_AWS_54,CKV_AWS_55,CKV_AWS_56,CKV_AWS_57,CKV_AWS_60,CKV_AWS_61,CKV_AWS_62,CKV_AWS_63,CKV_AWS_66,CKV_AWS_93,CKV_AWS_223,CKV_AWS_249,CKV_AWS_261,CKV_AWS_274,CKV_AWS_277,CKV_AWS_286,CKV_AWS_287,CKV_AWS_288,CKV_AWS_289,CKV_AWS_290,CKV_AWS_319,CKV_AWS_328,CKV_AWS_332,CKV_AWS_334,CKV_AWS_335,CKV_AWS_355,CKV_AWS_393,CKV2_AWS_5,CKV2_AWS_6,CKV2_AWS_16,CKV2_AWS_35,CKV2_AWS_40,CKV2_AWS_44,CKV2_AWS_56,CKV2_AWS_74,CKV2_AWS_76
          soft_fail: false

      - name: Build application image for scanning
        run: docker build --tag secure-saas-ci:scan app/

      - name: Test application entrypoint
        run: docker run --rm secure-saas-ci:scan node --check index.js

      - name: Trivy container vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: secure-saas-ci:scan
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Init (without remote backend)
        run: terraform init -backend=false
        working-directory: terraform/environments/dev

      - name: Terraform Validate
        run: terraform validate
        working-directory: terraform/environments/dev
